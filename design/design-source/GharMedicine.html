<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<title>Ghar medicine time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&amp;family=Tiro+Devanagari+Marathi&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#23305E}a:hover{color:#151D3B}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .55s ease-out both}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-origin:50% 0;animation:sway 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pop,.sway{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Mukta', sans-serif; color: #2A1E14; background: #FBF1DE">

<sc-if value="{{isDue}}" hint-placeholder-val="{{true}}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 22px 24px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 14px">
    <svg class="sway" width="64" height="64" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" fill="#F2B632" stroke="#7A4A22" stroke-width="1.4" stroke-linejoin="round"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="#7A4A22" stroke-width="1.6" stroke-linecap="round"></path></svg>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 36px; line-height: 1.3; font-weight: 400">औषधाची वेळ</h1>
      <span style="font-size: 22px; line-height: 1.4; color: #5C4632">दुपारी १:१५</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 999px; background: #FFFFFF; align-self: flex-start; box-shadow: 0 2px 0 #EAD9B8">
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#E9D3A8"></circle><circle cx="12" cy="12" r="6.5" fill="#FFFFFF" stroke="#C9A86A" stroke-width="1"></circle><circle cx="10" cy="11" r="1.6" fill="#E8833A"></circle><circle cx="13.5" cy="13" r="1.3" fill="#2F6B3A"></circle></svg>
    <span style="font-size: 22px; line-height: 1.35; font-weight: 600">जेवण झालं ना? मग आता</span>
  </div>

  <div style="border-radius: 26px; overflow: hidden; background: #FFFFFF; box-shadow: 0 3px 0 #EAD9B8">
    <div style="height: 170px; background: #EDE3D0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5C4632" role="img" aria-label="[औषधाच्या पाकिटाचा फोटो]">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-8 7"></path></svg>
      <span style="font-size: 18px; line-height: 1.4">[औषधाच्या पाकिटाचा फोटो]</span>
    </div>
    <div style="padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 40px; line-height: 1.15; font-weight: 800; color: #23305E">Telma AM</span>
      <span style="font-size: 26px; line-height: 1.4; font-weight: 600">[डोस]</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button onClick="{{take}}" style="min-height: 92px; border-radius: 22px; border: none; background: #2F6B3A; color: #FFFFFF; font-size: 30px; line-height: 1.3; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      घेतली
    </button>
    <button onClick="{{snooze}}" style="min-height: 80px; border-radius: 22px; border: 3px solid #5C4632; background: #FFFFFF; color: #2A1E14; font-size: 24px; line-height: 1.3; font-weight: 800">१५ मिनिटांनी सांग</button>
  </div>
  <p style="margin: 0; font-size: 18px; line-height: 1.45; text-align: center; color: #5C4632">औषधाबद्दल प्रश्न? डॉक्टरांना विचारा</p>
</div>
</sc-if>

<sc-if value="{{isTaken}}" hint-placeholder-val="{{false}}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px">
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <div class="pop" style="width: 168px; height: 168px; border-radius: 50%; background: #2F6B3A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 16px rgba(47,107,58,.15)">
      <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 42px; line-height: 1.35; font-weight: 400">छान, आजी!</h1>
    <p style="margin: 0; font-size: 24px; line-height: 1.5; text-align: center">पुढचं औषध रात्री जेवणानंतर</p>
  </div>
  <button onClick="{{reset}}" style="width: 100%; min-height: 88px; border-radius: 22px; border: none; background: #23305E; color: #FFFFFF; font-size: 28px; line-height: 1.3; font-weight: 800">ठीक आहे</button>
</div>
</sc-if>

<sc-if value="{{isSnoozed}}" hint-placeholder-val="{{false}}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px">
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <div class="pop" style="width: 150px; height: 150px; border-radius: 50%; background: #F2B632; display: flex; align-items: center; justify-content: center">
      <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#2A1E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 38px; line-height: 1.35; font-weight: 400; text-align: center">ठीक आहे</h1>
    <p style="margin: 0; font-size: 24px; line-height: 1.5; text-align: center">१:३० ला परत सांगतो</p>
  </div>
  <button onClick="{{reset}}" style="width: 100%; min-height: 88px; border-radius: 22px; border: none; background: #23305E; color: #FFFFFF; font-size: 28px; line-height: 1.3; font-weight: 800">ठीक आहे</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'due' };
  }
  renderVals() {
    const st = this.state.status;
    return {
      isDue: st === 'due',
      isTaken: st === 'taken',
      isSnoozed: st === 'snoozed',
      take: () => this.setState({ status: 'taken' }),
      snooze: () => this.setState({ status: 'snoozed' }),
      reset: () => this.setState({ status: 'due' })
    };
  }
}
</script>
</body>
</html>
