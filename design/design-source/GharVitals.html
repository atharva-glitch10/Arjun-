<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<title>Ghar BP check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&amp;family=Tiro+Devanagari+Marathi&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#23305E}a:hover{color:#151D3B}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.97)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .55s ease-out both}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Mukta', sans-serif; color: #2A1E14; background: #FBF1DE">

<sc-if value="{{isConfirm}}" hint-placeholder-val="{{true}}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 22px 24px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 14px">
    <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EAD9B8">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path><path d="M3.5 12h4l2-3 3 6 2-3h6"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 34px; line-height: 1.3; font-weight: 400">BP तपासायची वेळ</h1>
      <span style="font-size: 22px; line-height: 1.4; color: #5C4632">सकाळी ९:०० · नाश्त्याआधी</span>
    </div>
  </div>

  <div style="padding: 14px 18px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 2px 0 #EAD9B8">
    <span style="font-size: 20px; line-height: 1.4; color: #5C4632">तुम्ही सांगितलं</span>
    <p style="margin: 0; font-size: 24px; line-height: 1.5; font-weight: 600">“एकशे बेचाळीस बाय अठ्ठ्याऐंशी, पल्स शहात्तर”</p>
  </div>

  <div style="border-radius: 26px; overflow: hidden; background: #FFFFFF; box-shadow: 0 3px 0 #EAD9B8">
    <div style="padding: 12px 22px; background: #23305E; color: #FFFFFF; font-size: 22px; line-height: 1.35; font-weight: 800">मी असं लिहितोय</div>
    <div style="padding: 18px 22px 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; line-height: 1.4; color: #5C4632">BP</span>
        <span style="font-size: 48px; line-height: 1.1; font-weight: 800; color: #23305E">१४२/८८</span>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; line-height: 1.4; color: #5C4632">पल्स</span>
        <span style="font-size: 48px; line-height: 1.1; font-weight: 800; color: #23305E">७६</span>
      </div>
    </div>
  </div>

  <p style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 30px; line-height: 1.35; text-align: center">बरोबर आहे का?</p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button onClick="{{save}}" style="min-height: 88px; border-radius: 22px; border: none; background: #23305E; color: #FFFFFF; font-size: 28px; line-height: 1.3; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      हो, बरोबर
    </button>
    <button style="min-height: 78px; border-radius: 22px; border: 3px solid #5C4632; background: #FFFFFF; color: #2A1E14; font-size: 24px; line-height: 1.3; font-weight: 800">नाही, परत सांगते</button>
  </div>
  <p style="margin: 0; font-size: 18px; line-height: 1.45; text-align: center; color: #5C4632">हे आकडे राहुललाही दिसतील</p>
</div>
</sc-if>

<sc-if value="{{isSaved}}" hint-placeholder-val="{{false}}">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px">
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <div class="pop" style="width: 160px; height: 160px; border-radius: 50%; background: #2F6B3A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 16px rgba(47,107,58,.15)">
      <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: 'Tiro Devanagari Marathi', serif; font-size: 40px; line-height: 1.35; font-weight: 400">नोंद केली</h1>
    <p style="margin: 0; font-size: 24px; line-height: 1.5; text-align: center">डॉक्टरांना दाखवण्यासाठी राहुलकडे ठेवली</p>
  </div>
  <button onClick="{{reset}}" style="width: 100%; min-height: 88px; border-radius: 22px; border: none; background: #23305E; color: #FFFFFF; font-size: 28px; line-height: 1.3; font-weight: 800">ठीक आहे</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { saved: false };
  }
  renderVals() {
    return {
      isConfirm: !this.state.saved,
      isSaved: this.state.saved,
      save: () => this.setState({ saved: true }),
      reset: () => this.setState({ saved: false })
    };
  }
}
</script>
</body>
</html>
